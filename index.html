<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Votación Borda</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 20px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px;
      flex-wrap: wrap;
    }

    .opcion {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 120px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-weight: bold;
    }

    .votante {
      margin: 10px;
    }

    /* Estilos para el nuevo panel de configuración */
    .configuracion {
      background: #e9ecef;
      padding: 15px;
      border-radius: 8px;
      max-width: 400px;
      margin: 20px auto;
      text-align: left;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    
    .configuracion h4 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
    }

    .configuracion label {
      display: block;
      margin-bottom: 8px;
      cursor: pointer;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
    }

    button:hover {
      background: #45a049;
    }

    #resultado {
      margin-top: 30px;
      font-size: 18px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    .resultado-item {
      margin-bottom: 20px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.05);
    }

    .detalle-calculo {
      font-size: 14px;
      color: #555;
      margin-top: 5px;
      margin-bottom: 10px;
      font-style: italic;
    }

    .barra {
      height: 20px;
      background: #4CAF50;
      border-radius: 4px;
      transition: width 1.5s ease-out;
    }
  </style>
</head>
<body>

<h1>Simulador de Votación Borda</h1>

<div class="container">
  <div class="opcion">Lomito</div>
  <div class="opcion">Milanesas</div>
  <div class="opcion">Asado</div>
  <div class="opcion">Hamburguesa</div>
</div>

<h3>Votantes (Orden de preferencia: 1º a 4º)</h3>

<div id="votantes"></div>

<!-- Nuevo panel de selección de método -->
<div class="configuracion">
  <h4>Método de Puntuación</h4>
  <label>
    <input type="radio" name="metodo" value="n" checked>
    <strong>Sistema n:</strong> 4 pts (1º), 3 pts (2º), 2 pts (3º), 1 pt (4º)
  </label>
  <label>
    <input type="radio" name="metodo" value="n-1">
    <strong>Sistema n-1:</strong> 3 pts (1º), 2 pts (2º), 1 pt (3º), 0 pts (4º)
  </label>
</div>

<button onclick="calcular()">Calcular resultado y ver desglose</button>

<div id="resultado"></div>

<script>
const opciones = ["Lomito", "Milanesas", "Asado", "Hamburguesa"];

function crearVotantes() {
  const cont = document.getElementById("votantes");

  for(let i=1; i<=4; i++){
    let div = document.createElement("div");
    div.className = "votante";

    div.innerHTML = `
      <input placeholder="Nombre votante ${i}">
      <select>${opciones.map(o=>`<option value="${o}">${o}</option>`).join("")}</select>
      <select>${opciones.map(o=>`<option value="${o}">${o}</option>`).join("")}</select>
      <select>${opciones.map(o=>`<option value="${o}">${o}</option>`).join("")}</select>
      <select>${opciones.map(o=>`<option value="${o}">${o}</option>`).join("")}</select>
    `;

    cont.appendChild(div);
  }
}

function calcular(){
  // 1. Verificamos qué método está seleccionado en los radio buttons
  const metodoSeleccionado = document.querySelector('input[name="metodo"]:checked').value;
  
  // 2. Asignamos los puntos dinámicamente según el método
  let puntos;
  if (metodoSeleccionado === "n") {
    puntos = [4, 3, 2, 1];
  } else {
    puntos = [3, 2, 1, 0];
  }

  let resultado = {Lomito: 0, Milanesas: 0, Asado: 0, Hamburguesa: 0};
  let detalle = {
    Lomito: [0, 0, 0, 0],
    Milanesas: [0, 0, 0, 0],
    Asado: [0, 0, 0, 0],
    Hamburguesa: [0, 0, 0, 0]
  };

  document.querySelectorAll(".votante").forEach(v => {
    let selects = v.querySelectorAll("select");

    selects.forEach((s, i)=>{
      let opcionElegida = s.value;
      resultado[opcionElegida] += puntos[i]; // Ahora usa los puntos dinámicos
      detalle[opcionElegida][i]++;
    });
  });

  // 3. Pasamos los puntos a la función mostrar para que el desglose sea preciso
  mostrar(resultado, detalle, puntos);
}

function animar(id, valor){
  let actual = 0;
  let intervalo = setInterval(()=>{
    actual++;
    document.getElementById(id).style.width = actual + "%";
    if(actual >= valor) clearInterval(intervalo);
  }, 15);
}

function mostrar(res, det, puntosActuales){
  let totalMax = 0;
  for(let k in res) {
    if(res[k] > totalMax) totalMax = res[k];
  }

  let html = "";

  for(let k in res){
    let desgloseMatematico = [];
    for(let i = 0; i < 4; i++) {
      if(det[k][i] > 0) {
        // Multiplicamos por los puntos actuales seleccionados (n o n-1)
        desgloseMatematico.push(`(${det[k][i]} voto/s × ${puntosActuales[i]} pts)`);
      }
    }
    
    let textoDesglose = desgloseMatematico.length > 0 ? desgloseMatematico.join(" + ") : "0 votos";

    html += `
      <div class="resultado-item">
        <div><strong>${k}: ${res[k]} pts totales</strong></div>
        <div class="detalle-calculo">Cálculo: ${textoDesglose}</div>
        <div class="barra" id="barra${k}" style="width:0%"></div>
      </div>
    `;
  }

  document.getElementById("resultado").innerHTML = html;

  for(let k in res){
    let porcentaje = totalMax > 0 ? (res[k]/totalMax)*100 : 0;
    animar("barra"+k, porcentaje);
  }
}

crearVotantes();
</script>

</body>
</html>
